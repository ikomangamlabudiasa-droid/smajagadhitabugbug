<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aplikasi Pengumpulan Tugas</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- LOGIN PAGE -->
    <div id="loginPage" class="page active">
      <div class="card login-card">
        <h1>📚 Pengumpulan Tugas</h1>
        <p class="subtitle">Silakan login untuk melanjutkan</p>
        
        <div class="tabs">
          <button class="tab active" data-role="student">👨‍🎓 Student</button>
          <button class="tab" data-role="teacher">👨‍🏫 Teacher</button>
        </div>

        <div class="form-group">
          <label>Username</label>
          <input type="text" id="username" placeholder="Masukkan username" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="Masukkan password" />
        </div>

        <button class="btn-primary" onclick="login()">Login</button>
        <p class="hint">Demo: <b>student/123</b> atau <b>teacher/123</b></p>
      </div>
    </div>

    <!-- STUDENT PAGE -->
    <div id="studentPage" class="page">
      <header>
        <h2>👨‍🎓 Dashboard Student</h2>
        <div>
          <span id="studentName"></span>
          <button class="btn-logout" onclick="logout()">Logout</button>
        </div>
      </header>

      <div class="container">
        <div class="card">
          <h3>📝 Tugas Tersedia</h3>
          <div id="taskList"></div>
        </div>

        <div class="card">
          <h3>📤 Submission Saya</h3>
          <div id="mySubmissions"></div>
        </div>
      </div>
    </div>

    <!-- TEACHER PAGE -->
    <div id="teacherPage" class="page">
      <header>
        <h2>👨‍🏫 Dashboard Teacher</h2>
        <div>
          <span id="teacherName"></span>
          <button class="btn-logout" onclick="logout()">Logout</button>
        </div>
      </header>

      <div class="container">
        <div class="card">
          <h3>➕ Buat Tugas Baru</h3>
          <div class="form-group">
            <label>Judul Tugas</label>
            <input type="text" id="taskTitle" placeholder="Contoh: Latihan Algoritma" />
          </div>
          <div class="form-group">
            <label>Deskripsi</label>
            <textarea id="taskDesc" rows="3" placeholder="Deskripsi tugas..."></textarea>
          </div>
          <div class="form-group">
            <label>Deadline</label>
            <input type="date" id="taskDeadline" />
          </div>
          <button class="btn-primary" onclick="createTask()">Buat Tugas</button>
        </div>

        <div class="card">
          <h3>📋 Daftar Tugas</h3>
          <div id="teacherTaskList"></div>
        </div>

        <div class="card">
          <h3>📥 Submission Student</h3>
          <div id="allSubmissions"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL SUBMIT -->
  <div id="submitModal" class="modal">
    <div class="modal-content">
      <h3 id="modalTitle">Submit Tugas</h3>
      <div class="form-group">
        <label>Jawaban / Link</label>
        <textarea id="submitAnswer" rows="4" placeholder="Tulis jawaban atau tempel link..."></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeModal()">Batal</button>
        <button class="btn-primary" onclick="submitTask()">Kirim</button>
      </div>
    </div>
  </div>

  <!-- TOAST -->
  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
